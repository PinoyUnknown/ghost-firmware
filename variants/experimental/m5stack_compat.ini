; The Cardputer Mesh Kit uses the production Cardputer ADV hardware definition.
; This alias keeps the short build/upload command while preserving its LoRa/GPS config.

[m5stack_compat]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5GFX @ 0.1.17
  m5stack/M5Unified @ 0.1.17

[env:m5stack-cardputer]
extends = env:m5stack-cardputer-adv
board_level = extra

[env:m5stack-core2]
extends = m5stack_compat
board = m5stack-core2
build_flags =
  ${m5stack_compat.build_flags}
  -D CORE2_HARDWARE

[env:m5stick-cplus]
extends = m5stack_compat
board = m5stick-c
build_flags =
  ${m5stack_compat.build_flags}
  -D STICKC_PLUS_HARDWARE
