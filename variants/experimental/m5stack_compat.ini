; Experimental generic M5Stack Arduino profiles based on the user's requested
; configuration. These do not add Meshtastic board support. Use
; m5stack-cardputer-adv for the Cardputer Mesh Kit.

[m5stack_compat]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5GFX @ 0.1.17
  m5stack/M5Unified @ 0.1.17

[env:m5stack-cardputer]
extends = m5stack_compat
board = esp32-s3-devkitc-1
build_flags =
  ${m5stack_compat.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_M5Stack_Cardputer
  -D CARDPUTER_HARDWARE

[env:m5stack-core2]
extends = m5stack_compat
board = m5stack-core2
build_flags =
  ${m5stack_compat.build_flags}
  -D CORE2_HARDWARE

[env:m5stick-cplus]
extends = m5stack_compat
board = m5stick-c
build_flags =
  ${m5stack_compat.build_flags}
  -D STICKC_PLUS_HARDWARE
