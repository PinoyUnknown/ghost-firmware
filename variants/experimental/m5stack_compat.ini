; Standalone Ghost builds use a separate app source and do not replace Mesh Kit firmware.

[m5stack_compat]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5GFX @ 0.1.17
  m5stack/M5Unified @ 0.1.17

[env:m5stack-cardputer]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default_8MB.csv
build_src_filter = -<*> +<ghost_app/main.cpp>
extra_scripts =
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5GFX @ 0.1.17
  m5stack/M5Unified @ 0.1.17
board_level = extra

[env:m5stack-core2]
extends = m5stack_compat
board = m5stack-core2
build_flags =
  ${m5stack_compat.build_flags}
  -D CORE2_HARDWARE

[env:m5stick-cplus]
extends = m5stack_compat
board = m5stick-c
build_flags =
  ${m5stack_compat.build_flags}
  -D STICKC_PLUS_HARDWARE
