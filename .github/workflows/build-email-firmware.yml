name: Build Email Firmware

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "Email-Firmware/**"
      - "default_8MB.csv"
      - "ReadMe.md"
      - ".github/workflows/build-email-firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio intelhex
      - name: Build Cardputer Email Firmware
        run: pio run -d Email-Firmware -e cardputer
      - name: Assemble flash image
        run: |
          set -euo pipefail
          build_dir="Email-Firmware/.pio/build/cardputer"
          packages_dir="$HOME/.platformio/packages"
          python "$packages_dir/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin \
            -o Email-Firmware.bin --flash_mode dio --flash_size 8MB \
            0x0 "$build_dir/bootloader.bin" \
            0x8000 "$build_dir/partitions.bin" \
            0xe000 "$packages_dir/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 "$build_dir/firmware.bin"
          sha256sum Email-Firmware.bin > Email-Firmware.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Email-Firmware
          path: |
            Email-Firmware.bin
            Email-Firmware.bin.sha256
          if-no-files-found: error
      - name: Attach firmware to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Email-Firmware.bin Email-Firmware.bin.sha256 --clobber
