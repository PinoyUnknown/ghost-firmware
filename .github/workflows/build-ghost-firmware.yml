name: Build Ghost Firmware

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "src/ghost_app/**"
      - "variants/experimental/m5stack_compat.ini"
      - "platformio.ini"
      - "Cyberpunk_2077_v1.0.0/**"
      - "Ghost-Firmware/**"
      - "ReadMe.md"
      - ".github/workflows/build-ghost-firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio intelhex
      - name: Build Cardputer Ghost firmware
        run: pio run -e m5stack-cardputer
      - name: Assemble full-flash image
        run: |
          set -euo pipefail
          build_dir=".pio/build/m5stack-cardputer"
          packages_dir="$HOME/.platformio/packages"
          python "$packages_dir/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin \
            -o Ghost-Firmware.bin --flash_mode dio --flash_size 8MB \
            0x0 "$build_dir/bootloader.bin" \
            0x8000 "$build_dir/partitions.bin" \
            0xe000 "$packages_dir/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 "$build_dir/firmware.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: Ghost-Firmware
          path: Ghost-Firmware.bin
          if-no-files-found: error
      - name: Attach firmware to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Ghost-Firmware.bin --clobber
