name: Build Ghost Cardputer Mesh firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "variants/esp32s3/m5stack_cardputer_adv/**"
      - "bin/**"
      - "protobufs/**"
      - ".gitmodules"
      - "platformio.ini"
      - "version.properties"
      - "Cyberpunk_2077_v1.0.0/**"
      - "README.md"
      - ".github/workflows/build-ghost-firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Download nanopb
        env:
          NANOPB_VERSION: 0.4.9.1
          NANOPB_SHA256: 951a9ab2385424a4cdf245d0c84f4c88c6ccbc65a0dade4b246d50c068f24128
        run: |
          set -euo pipefail
          tarball="nanopb-${NANOPB_VERSION}-linux-x86.tar.gz"
          wget -q "https://github.com/nanopb/nanopb/releases/download/nanopb-${NANOPB_VERSION}/${tarball}"
          echo "${NANOPB_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}"
          mv "nanopb-${NANOPB_VERSION}-linux-x86" nanopb-0.4.9
      - name: Generate protocol buffers
        run: bash bin/regen-protos.sh
      - name: Build Cardputer Mesh firmware
        run: pio run -e m5stack-cardputer-adv
      - name: Name firmware image
        run: |
          image="$(find .pio/build/m5stack-cardputer-adv -maxdepth 1 -type f -name 'firmware-m5stack-cardputer-adv-*.bin' ! -name '*.factory.bin' -print -quit)"
          test -n "$image"
          cp "$image" Ghost-Firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Ghost-Firmware
          path: Ghost-Firmware.bin
          if-no-files-found: error
