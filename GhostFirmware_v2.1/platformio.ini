; ----------------------------------------------------------------------------
; GHOST FIRMWARE v2.1 - UNIVERSAL ESP32-S3 & CARDPUTER MESH CONFIGURATION
; DEVELOPER : PinoyUnknown (www.instagram.com/pinoyunknown)
; REPOSITORY: https://github.com/PinoyUnknown/ghost-firmware
; ----------------------------------------------------------------------------
[platformio]
default_envs = m5stack-cardputer

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags = 
	-D CORE_DEBUG_LEVEL=0
	-D GHOST_FIRMWARE_V2_1=1
lib_deps = 
	m5stack/M5GFX @ 0.1.17
	m5stack/M5Unified @ 0.1.17
	esphome/ESP32-audioI2S @ 2.3.0

; ----------------------------------------------------------------------------
; TARGET 1: M5STACK CARDPUTER v1.0 / v1.1 / ADV / CARDPUTER MESH (ESP32-S3)
; ----------------------------------------------------------------------------
[env:m5stack-cardputer]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_ghost_4mb.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 8MB
build_flags = 
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_M5Stack_Cardputer
	-D CARDPUTER_HARDWARE
	-D M5GFX_BOARD=m5gfx::board_t::board_M5Cardputer

; ----------------------------------------------------------------------------
; TARGET 2: CARDPUTER MESH / CARDPUTER-ADV (SX1262 LORA + ESP-NOW MESH)
; ----------------------------------------------------------------------------
[env:cardputer-mesh]
extends = env:m5stack-cardputer
build_flags = 
	${env:m5stack-cardputer.build_flags}
	-D CARDPUTER_MESH_EDITION=1

; ----------------------------------------------------------------------------
; TARGET 3: UNIVERSAL ESP32-S3 (4MB / 8MB / 16MB FLASH COMPATIBLE)
; ----------------------------------------------------------------------------
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_ghost_4mb.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
build_flags = 
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_M5Stack_Cardputer
	-D CARDPUTER_HARDWARE
	-D M5GFX_BOARD=m5gfx::board_t::board_M5Cardputer

; ----------------------------------------------------------------------------
; TARGET 4: M5STACK CORE2 (ESP32-D0WDQ6-V3)
; ----------------------------------------------------------------------------
[env:m5stack-core2]
board = m5stack-core2
board_build.partitions = partitions_ghost_4mb.csv
build_flags = 
	${env.build_flags}
	-D CORE2_HARDWARE

; ----------------------------------------------------------------------------
; TARGET 5: M5STICKC PLUS (ESP32-PICO-D4)
; ----------------------------------------------------------------------------
[env:m5stick-cplus]
board = m5stick-c
board_build.partitions = partitions_ghost_4mb.csv
build_flags = 
	${env.build_flags}
	-D STICKC_PLUS_HARDWARE
